[project]
name = "parallax"
version = "0.1.0"
description = "Counterfactual reliability testing for MCP agents"
readme = "README.md"
authors = [
    { name = "Kaustubh", email = "kaustubhchaudhari23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pydantic>=2.14.1",
]

[project.scripts]
parallax = "parallax.server:main"

[project.optional-dependencies]
live = [
    "openai>=3.37.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
